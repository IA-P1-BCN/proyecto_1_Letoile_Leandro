<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="2000" viewBox="0 0 2000 2000">
  <defs>

    <!-- =========================
         FONDO PROFUNDO
    ========================== -->
    <radialGradient id="background" cx="50%" cy="48%" r="78%">
      <stop offset="0%" stop-color="#0b1830"/>
      <stop offset="35%" stop-color="#071326"/>
      <stop offset="68%" stop-color="#030914"/>
      <stop offset="100%" stop-color="#010208"/>
    </radialGradient>

    <!-- =========================
         NEBULOSAS
    ========================== -->
    <radialGradient id="blue">
      <stop offset="0%" stop-color="#3b9cff" stop-opacity=".42"/>
      <stop offset="25%" stop-color="#2563eb" stop-opacity=".30"/>
      <stop offset="52%" stop-color="#1d4ed8" stop-opacity=".16"/>
      <stop offset="78%" stop-color="#172554" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyan">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity=".36"/>
      <stop offset="25%" stop-color="#06b6d4" stop-opacity=".25"/>
      <stop offset="55%" stop-color="#0891b2" stop-opacity=".12"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple">
      <stop offset="0%" stop-color="#c084fc" stop-opacity=".36"/>
      <stop offset="25%" stop-color="#a855f7" stop-opacity=".28"/>
      <stop offset="55%" stop-color="#7e22ce" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="magenta">
      <stop offset="0%" stop-color="#f472b6" stop-opacity=".24"/>
      <stop offset="30%" stop-color="#ec4899" stop-opacity=".16"/>
      <stop offset="60%" stop-color="#be185d" stop-opacity=".07"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="indigo">
      <stop offset="0%" stop-color="#6366f1" stop-opacity=".28"/>
      <stop offset="35%" stop-color="#4f46e5" stop-opacity=".17"/>
      <stop offset="70%" stop-color="#312e81" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#020611" stop-opacity="0"/>
    </radialGradient>

    <!-- =========================
         POLVO
    ========================== -->
    <linearGradient id="dust" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0"/>
      <stop offset="20%" stop-color="#60a5fa" stop-opacity=".06"/>
      <stop offset="42%" stop-color="#a78bfa" stop-opacity=".10"/>
      <stop offset="58%" stop-color="#22d3ee" stop-opacity=".07"/>
      <stop offset="80%" stop-color="#60a5fa" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </linearGradient>

    <!-- =========================
         ESTRELLAS
    ========================== -->
    <radialGradient id="starGlow">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="20%" stop-color="#dbeafe" stop-opacity=".55"/>
      <stop offset="55%" stop-color="#60a5fa" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur18">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <filter id="blur35">
      <feGaussianBlur stdDeviation="35"/>
    </filter>

    <filter id="blur55">
      <feGaussianBlur stdDeviation="55"/>
    </filter>

  </defs>

